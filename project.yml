name: Zujian
configs:
  Debug: debug
  FreshAuth: debug
  FreshAuth4: debug
  Release: release
options:
  bundleIdPrefix: com.linfanbin
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: 5.0
    CURRENT_PROJECT_VERSION: 16
    MARKETING_VERSION: 1.0.14
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: V7439G9SY8
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    SWIFT_STRICT_CONCURRENCY: minimal
targets:
  Zujian:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    attributes:
      SystemCapabilities:
        com.apple.HealthKit:
          enabled: 1
        com.apple.BackgroundModes:
          enabled: 1
        com.apple.ApplicationGroups:
          enabled: 1
    sources:
      - path: Zujian
        excludes:
          - Resources/Info.plist
          - Resources/Info-Release.plist
          - Resources/Zujian.entitlements
      - path: Shared/Recording
    resources:
      - path: Zujian/Resources/Assets.xcassets
    info:
      path: Zujian/Resources/Info.plist
      properties:
        CFBundleDisplayName: $(APP_DISPLAY_NAME)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh_CN
        CFBundleLocalizations:
          - zh_CN
        NSHealthShareUsageDescription: 组间读取训练中的实时心率，用于计算每组的平均心率和最高心率。
        NSHealthUpdateUsageDescription: 组间需要启动系统训练会话以在训练期间稳定运行。
        NSMotionUsageDescription: 组间使用手腕运动数据自动判断一组训练何时开始和结束。
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(WATCH_COMPANION_BUNDLE_IDENTIFIER)
        WKBackgroundModes:
          - workout-processing
    entitlements:
      path: Zujian/Resources/Zujian.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.security.application-groups:
          - group.com.linfanbin.zujian
    dependencies:
      - target: ZujianWidgets
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.linfanbin.zujian.watchapp
        PRODUCT_NAME: Zujian
        APP_DISPLAY_NAME: 组间
        WATCH_COMPANION_BUNDLE_IDENTIFIER: com.linfanbin.zujian
        INFOPLIST_KEY_CFBundleDisplayName: $(APP_DISPLAY_NAME)
        INFOPLIST_KEY_WKApplication: YES
        TARGETED_DEVICE_FAMILY: 4
        SKIP_INSTALL: YES
        ENABLE_PREVIEWS: YES
        SUPPORTS_MACCATALYST: NO
      configs:
        Release:
          INFOPLIST_FILE: Zujian/Resources/Info-Release.plist
        FreshAuth:
          PRODUCT_BUNDLE_IDENTIFIER: com.linfanbin.zujian.permissiontest0831b.watchapp
          APP_DISPLAY_NAME: 组间·权限测试3
          WATCH_COMPANION_BUNDLE_IDENTIFIER: com.linfanbin.zujian.permissiontest0831b
        FreshAuth4:
          PRODUCT_BUNDLE_IDENTIFIER: com.linfanbin.zujian.permissiontest0831c.watchapp
          APP_DISPLAY_NAME: 组间·权限测试4
          WATCH_COMPANION_BUNDLE_IDENTIFIER: com.linfanbin.zujian.permissiontest0831c
    preBuildScripts:
      - name: Block FreshAuth Archive
        basedOnDependencyAnalysis: false
        script: |
          case "$CONFIGURATION" in
            FreshAuth*)
              if [ "$ACTION" = "install" ]; then
                echo "error: Zujian FreshAuth is development-only and cannot be archived."
                exit 1
              fi
              ;;
          esac
  ZujianDistribution:
    type: application.watchapp2-container
    platform: iOS
    deploymentTarget: "17.0"
    info:
      path: ZujianDistribution/Info.plist
      properties:
        CFBundleDisplayName: 组间
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh_CN
        CFBundleLocalizations:
          - zh_CN
        ITSAppUsesNonExemptEncryption: false
    dependencies:
      - target: Zujian
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.linfanbin.zujian
        PRODUCT_NAME: Zujian
        INFOPLIST_KEY_CFBundleDisplayName: 组间
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        SKIP_INSTALL: NO
        VALIDATE_PRODUCT: YES
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        FreshAuth:
          PRODUCT_BUNDLE_IDENTIFIER: com.linfanbin.zujian.permissiontest0831b
        FreshAuth4:
          PRODUCT_BUNDLE_IDENTIFIER: com.linfanbin.zujian.permissiontest0831c
  ZujianStudio:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ZujianStudio
        excludes:
          - Resources/Info.plist
      - path: Shared/Recording
      - path: Zujian/Resources/Assets.xcassets
        buildPhase: resources
    info:
      path: ZujianStudio/Resources/Info.plist
      properties:
        CFBundleDisplayName: 组间素材台
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh_CN
        CFBundleLocalizations:
          - zh_CN
        ITSAppUsesNonExemptEncryption: false
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.linfanbin.zujian
        PRODUCT_NAME: ZujianStudio
        INFOPLIST_KEY_CFBundleDisplayName: 组间素材台
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: ""
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: YES
      configs:
        FreshAuth:
          PRODUCT_BUNDLE_IDENTIFIER: com.linfanbin.zujian.permissiontest0831b
        FreshAuth4:
          PRODUCT_BUNDLE_IDENTIFIER: com.linfanbin.zujian.permissiontest0831c
    preBuildScripts:
      - name: Block Studio Archive
        basedOnDependencyAnalysis: false
        script: |
          if [ "$ACTION" = "install" ]; then
            echo "error: ZujianStudio is a development-only recording tool and cannot be archived."
            exit 1
          fi
  ZujianWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups:
          enabled: 1
    sources:
      - path: ZujianWidgets
        excludes:
          - Info.plist
          - ZujianWidgets.entitlements
      - path: Zujian/Models/ZujianWidgetSnapshot.swift
      - path: ZujianWidgets/Resources/WidgetAssets.xcassets
        buildPhase: resources
    info:
      path: ZujianWidgets/Info.plist
      properties:
        CFBundleDisplayName: 组间
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh_CN
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ZujianWidgets/ZujianWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.linfanbin.zujian
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.linfanbin.zujian.watchapp.widgets
        PRODUCT_NAME: ZujianWidgets
        TARGETED_DEVICE_FAMILY: 4
        APPLICATION_EXTENSION_API_ONLY: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES
        ENABLE_PREVIEWS: YES
      configs:
        FreshAuth:
          PRODUCT_BUNDLE_IDENTIFIER: com.linfanbin.zujian.permissiontest0831b.watchapp.widget
        FreshAuth4:
          PRODUCT_BUNDLE_IDENTIFIER: com.linfanbin.zujian.permissiontest0831c.watchapp.widget
  ZujianTests:
    type: bundle.unit-test
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ZujianTests
        excludes:
          - Fixtures
      - path: ZujianTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: Zujian
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.linfanbin.zujian.tests
        GENERATE_INFOPLIST_FILE: YES
  ZujianUITests:
    type: bundle.ui-testing
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: ZujianUITests
    dependencies:
      - target: Zujian
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.linfanbin.zujian.uitests
        GENERATE_INFOPLIST_FILE: YES
  ZujianStudioTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: ZujianStudioTests
    dependencies:
      - target: ZujianStudio
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.linfanbin.zujian.studio.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Zujian:
    build:
      targets:
        Zujian: [run, test, profile, analyze]
        ZujianTests: [test]
        ZujianDistribution: [archive]
    test:
      targets:
        - ZujianTests
        - ZujianUITests
    archive:
      config: Release
  Zujian FreshAuth:
    build:
      targets:
        Zujian: [run, analyze]
    run:
      config: FreshAuth
    profile:
      config: FreshAuth
    analyze:
      config: FreshAuth
    archive:
      config: FreshAuth
  Zujian FreshAuth 4:
    build:
      targets:
        Zujian: [run, analyze]
    run:
      config: FreshAuth4
    profile:
      config: FreshAuth4
    analyze:
      config: FreshAuth4
    archive:
      config: FreshAuth4
  ZujianStudio:
    build:
      targets:
        ZujianStudio: [run, test, profile, analyze]
        ZujianStudioTests: [test]
    test:
      targets:
        - ZujianStudioTests
